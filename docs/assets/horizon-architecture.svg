<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">Horizon 应用基础架构</title><desc id="desc">用户通过 React 界面工作。外部 Agent 通过本机 MCP 桥接访问页面工具注册表，复用页面状态和生成 SDK。业务请求经过 Goa、认证与 Casbin 授权进入应用服务，由 Repository、sqlc 与 pgx 访问 PostgreSQL 并强制数据范围。底部另示 API 契约和 SQL 代码生成链路。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c88a5"/></marker></defs>
<rect width="1200" height="1100" rx="24" fill="#f8f9fc"/>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202a40}.muted{fill:#68748d}.blue{fill:#5267ce}</style>
<text x="48" y="54" font-size="28" font-weight="650" class="">HORIZON / 应用基础架构</text>
<text x="48" y="85" font-size="18" font-weight="400" class="muted">一个应用底座，两种协作入口。</text>
<rect x="48" y="116" width="430" height="96" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="72" y="151" font-size="22" font-weight="600" class="">用户</text>
<text x="72" y="184" font-size="17" font-weight="400" class="muted">通过浏览器访问、操作和查看结果</text>
<rect x="718" y="116" width="434" height="96" rx="14" fill="#eef0ff" stroke="#ccd3f7"/>
<text x="742" y="151" font-size="22" font-weight="600" class="">外部 Agent 客户端</text>
<text x="742" y="184" font-size="17" font-weight="400" class="muted">Codex / WorkBuddy · WebSkills 使用指引</text>
<path d="M 263 212 L 263 330" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="284" y="279" font-size="16" font-weight="400" class="muted">界面交互</text>
<rect x="718" y="232" width="434" height="66" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="742" y="260" font-size="18" font-weight="600" class="">本机 MCP 桥接</text>
<text x="742" y="284" font-size="16" font-weight="400" class="muted">stdio ↔ 本机代理 ↔ 浏览器 WebMCP</text>
<path d="M 935 212 L 935 232" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 935 298 L 935 330" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="330" width="1104" height="220" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="72" y="363" font-size="17" font-weight="650" class="blue">01 / 浏览器应用</text>
<rect x="72" y="383" width="458" height="73" rx="14" fill="#f8f9fc" stroke="#dce1ed"/>
<text x="92" y="412" font-size="20" font-weight="600" class="">React · TypeScript · shadcn/ui</text>
<text x="92" y="439" font-size="16" font-weight="400" class="muted">Router / 表单 / 表格 / 主题 / 国际化</text>
<rect x="658" y="383" width="470" height="73" rx="14" fill="#eef0ff" stroke="#ccd3f7"/>
<text x="678" y="412" font-size="20" font-weight="600" class="">页面工具注册表</text>
<text x="678" y="439" font-size="16" font-weight="400" class="muted">导航 / 筛选 / 只读查看 / 脱敏诊断</text>
<path d="M 658 420 L 530 420" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="548" y="400" font-size="14" font-weight="400" class="muted">复用页面</text>
<rect x="72" y="477" width="1056" height="49" rx="14" fill="#f8f9fc" stroke="#dce1ed"/>
<text x="95" y="508" font-size="18" font-weight="600" class="">TanStack Query + 生成 SDK  /  统一 API 消费</text>
<path d="M 600 550 L 600 594" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="578" font-size="16" font-weight="400" class="muted">HTTP / 同源 API</text>
<rect x="48" y="594" width="1104" height="92" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="72" y="625" font-size="20" font-weight="650" class="blue">02 / Go 服务 · Goa HTTP 传输</text>
<text x="72" y="658" font-size="19" font-weight="500" class="">会话认证 → 可信身份 → Casbin 操作授权 → 数据范围解析</text>
<path d="M 600 686 L 600 720" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="720" width="1104" height="124" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="72" y="752" font-size="18" font-weight="650" class="blue">03 / 应用服务 · 同一 Go 服务内分模块组织</text>
<rect x="72" y="774" width="232" height="46" rx="14" fill="#f8f9fc" stroke="#dce1ed"/>
<text x="88" y="804" font-size="17" font-weight="550" class="">身份 / 组织 / 权限</text>
<rect x="320" y="774" width="232" height="46" rx="14" fill="#f8f9fc" stroke="#dce1ed"/>
<text x="336" y="804" font-size="17" font-weight="550" class="">设置 / 字典</text>
<rect x="568" y="774" width="232" height="46" rx="14" fill="#f8f9fc" stroke="#dce1ed"/>
<text x="584" y="804" font-size="17" font-weight="550" class="">文件 / 通知</text>
<rect x="816" y="774" width="312" height="46" rx="14" fill="#f8f9fc" stroke="#dce1ed"/>
<text x="832" y="804" font-size="17" font-weight="550" class="">业务模块扩展点</text>
<path d="M 600 844 L 600 878" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="878" width="1104" height="86" rx="14" fill="#eef0ff" stroke="#ccd3f7"/>
<text x="72" y="911" font-size="21" font-weight="600" class="">04 / Repository → sqlc → pgx → PostgreSQL</text>
<text x="72" y="943" font-size="17" font-weight="400" class="muted">参数化 SQL · 工作区隔离 · 强制数据范围过滤</text>
<path d="M 48 994 H 1152" stroke="#dce1ed"/>
<text x="48" y="1027" font-size="17" font-weight="650" class="blue">代码生成链路（非运行时调用）</text>
<text x="48" y="1058" font-size="18" font-weight="400" class="">Goa DSL → OpenAPI → Orval SDK    /    SQL → sqlc    /    Goose 管理迁移</text>
<text x="48" y="1085" font-size="16" font-weight="400" class="muted">Agent 工具通过页面复用既有业务接口；所有受保护业务请求仍由后端校验权限。</text>
</svg>