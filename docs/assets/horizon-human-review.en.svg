<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Agents and People Working Toward Publication</title><desc id="desc">HUMAN IN THE LOOP  /  Example process; see architecture docs for implementation status</desc>
<defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f7faf9" /><stop offset="1" stop-color="#f0f5f3" /></linearGradient><filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#193f36" flood-opacity="0.055" /></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b9384" /></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#21483d}.title{font-size:32px;font-weight:650;letter-spacing:0.3px}.sub{font-size:21px;fill:#638074}.cardtitle{font-size:26px;font-weight:600}.body{font-size:22px;fill:#49695d}.label{font-size:20px;fill:#56796a}.num{font-size:17px;font-weight:650;fill:#598273;letter-spacing:2px}.arrow{fill:none;stroke:#6b9384;stroke-width:2.3;stroke-linejoin:round;marker-end:url(#arrow)}.lane{stroke:#c4d6cd;stroke-width:1.5;stroke-dasharray:5 7}</style>
<rect width="1440" height="820" rx="24" fill="url(#paper)" /><rect x="1" y="1" width="1438" height="818" rx="24" fill="none" stroke="#dce7e1" />
<text x="64" y="63" class="title" text-anchor="start" style="font-size:32px">Agents and People Working Toward Publication</text>
<text x="64" y="103" class="sub" text-anchor="start" style="font-size:21px">HUMAN IN THE LOOP  /  Example process; see architecture docs for implementation status</text>
<rect x="64" y="165" width="310" height="145" rx="18" fill="#eaf1fa" stroke="#b9cde4" filter="url(#shadow)" />
<text x="88" y="197" class="num" text-anchor="start" style="font-size:17px">01 / SUBMIT</text>
<text x="88" y="234" class="cardtitle" text-anchor="start" style="font-size:26px">Submit a Revision</text>
<text x="88" y="270" class="body" text-anchor="start" style="font-size:21px">Author requests publication</text>
<rect x="434" y="165" width="310" height="145" rx="18" fill="#eaf1fa" stroke="#b9cde4" filter="url(#shadow)" />
<text x="458" y="197" class="num" text-anchor="start" style="font-size:17px">02 / REVIEW</text>
<text x="458" y="234" class="cardtitle" text-anchor="start" style="font-size:26px">Agent Review</text>
<text x="458" y="270" class="body" text-anchor="start" style="font-size:21px">Rules &amp; authorized material</text>
<rect x="804" y="165" width="572" height="145" rx="18" fill="#e5f2ea" stroke="#b6d1c0" filter="url(#shadow)" />
<text x="828" y="197" class="num" text-anchor="start" style="font-size:17px">03 / VALIDATE</text>
<text x="828" y="234" class="cardtitle" text-anchor="start" style="font-size:26px">Validate the Verdict &amp; Revision</text>
<text x="828" y="270" class="body" text-anchor="start" style="font-size:21px">Publish only when the verdict and business rules allow it</text>
<path d="M374 237H434" class="arrow" />
<path d="M744 237H804" class="arrow" />
<rect x="1060" y="397" width="316" height="145" rx="18" fill="#e5f2ea" stroke="#b6d1c0" filter="url(#shadow)" />
<text x="1084" y="429" class="num" text-anchor="start" style="font-size:17px">PUBLISHED</text>
<text x="1084" y="466" class="cardtitle" text-anchor="start" style="font-size:26px">Published</text>
<text x="1084" y="502" class="body" text-anchor="start" style="font-size:22px">Establish business facts</text>
<path d="M1218 310V397" class="arrow" />
<text x="1238" y="365" class="label" text-anchor="start" style="font-size:20px">Rules met</text>
<rect x="434" y="470" width="500" height="166" rx="18" fill="#faf0df" stroke="#ddc7a2" filter="url(#shadow)" />
<text x="458" y="502" class="num" text-anchor="start" style="font-size:17px">HUMAN REVIEW</text>
<text x="458" y="539" class="cardtitle" text-anchor="start" style="font-size:26px">Awaiting Human Review</text>
<text x="458" y="575" class="body" text-anchor="start" style="font-size:21px">An authorized reviewer, not the author, decides</text>
<text x="458" y="606" class="body" text-anchor="start" style="font-size:20px">Decision bound to the revision and review reason</text>
<path d="M900 310V371H684V470" class="arrow" />
<text x="710" y="408" class="label" text-anchor="start" style="font-size:20px"><tspan x="710" y="408">Issues / Uncertainty</tspan><tspan x="710" y="436">Review unavailable</tspan></text>
<path d="M934 510H998V469H1060" class="arrow" />
<text x="970" y="453" class="label" text-anchor="middle" style="font-size:18px">Approve</text>
<rect x="1060" y="641" width="316" height="130" rx="18" fill="#faf0df" stroke="#ddc7a2" filter="url(#shadow)" />
<text x="1084" y="673" class="num" text-anchor="start" style="font-size:17px">REJECTED</text>
<text x="1084" y="710" class="cardtitle" text-anchor="start" style="font-size:26px">Rejected</text>
<text x="1084" y="746" class="body" text-anchor="start" style="font-size:22px">Show the author the reason</text>
<path d="M934 594H998V706H1060" class="arrow" />
<text x="970" y="670" class="label" text-anchor="end" style="font-size:20px">Reject</text>
<text x="64" y="790" class="label" text-anchor="start" style="font-size:20px">Content remains private before review. Model conclusions do not replace permissions, business rules or required human decisions.</text>
</svg>