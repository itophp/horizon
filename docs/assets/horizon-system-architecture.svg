<text x="220" y="1512" font-size="20" fill="#dbeafe" font-weight="400">业务事实经事件反馈到智能层；知识和记忆提供上下文；安全治理、插件机制与工程保障跨层支撑。</text>
<text x="40" y="1581" font-size="18" fill="#334155" font-weight="400">层级表示职责与支撑关系，不是请求执行时序。所有业务动作，包括流程启动、节点与 Agent 工具，均经过 Gateway。</text>
<text x="40" y="1616" font-size="18" fill="#334155" font-weight="400">当前边界：Memory 能力为 manual-only，尚未接入自动提炼、向量检索与自动清理；应用 Agent 记忆使用仍需专门接入。</text>
<text x="40" y="1651" font-size="17" fill="#334155" font-weight="400">Redis 与模型资源按具体能力启用；知识检索的向量路径不代表 Memory 已实现向量检索。模块存在不等于本次已完成运行验收。</text>
<text x="40" y="1693" font-size="17" fill="#64748b" font-weight="400">依据：当前模块目录与 app.CapabilityModules 装配、Application Runtime 实施记录、Memory Center 实施边界。</text>
</g></svg>
