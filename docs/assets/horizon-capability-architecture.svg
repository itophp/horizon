<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Horizon 当前能力中心架构</title><desc id="desc">多种入口经 Gateway 执行业务能力、Eino 编排和 Agent 工具，业务事实经 Outbox 和 Trigger 形成 AI 闭环。右侧为工程契约和身份治理支撑。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607980"/></marker></defs>
<rect width="1600" height="1600" rx="24" fill="#f6f8fa"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#163541}.title{font-size:34px;font-weight:700}.section{font-size:25px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#47636d}.label{font-size:17px;fill:#47636d}.line{fill:none;stroke:#607980;stroke-width:2.3;marker-end:url(#arrow)}</style>
<text x="60" y="72" class="title" text-anchor="start">Horizon · Capability-Centric AI-Native</text>
<text x="60" y="112" class="small" text-anchor="start">当前代码架构 / 2026-11-01 · 单仓库、单 Go 服务 · 业务能力是唯一契约</text>
<rect x="60" y="150" width="1070" height="100" rx="16" fill="#e5f5ef" stroke="#7da99a" stroke-width="1.5"/>
<text x="85" y="190" class="section" text-anchor="start">01  交互与接入</text>
<text x="85" y="226" class="body" text-anchor="start">React 页面 · 内置助手 · 远程 MCP · 页面 WebMCP · 事件 / 流程触发</text>
<path d="M595 250V290" class="line"/>
<rect x="60" y="290" width="1070" height="140" rx="16" fill="#e5f5ef" stroke="#7da99a" stroke-width="1.5"/>
<text x="85" y="332" class="section" text-anchor="start">02  能力契约与 Registry</text>
<text x="85" y="369" class="body" text-anchor="start">模块 Entries()：名称 / 版本 / Schema / 权限 / 风险 / 审批 / 幂等 / 事件</text>
<text x="85" y="405" class="small" text-anchor="start">Layer · Kind · Reads / Writes · Effect · RetrySafe    |    目录发现 ≠ 获准执行</text>
<path d="M595 430V470" class="line"/>
<rect x="60" y="470" width="1070" height="160" rx="16" fill="#d9eee7" stroke="#548f7b" stroke-width="1.5"/>
<text x="85" y="514" class="section" text-anchor="start">03  Capability Gateway · 唯一业务执行入口</text>
<text x="85" y="557" class="body" text-anchor="start">身份 → 权限 → Schema → 幂等 → 风险 / 审批 → 执行 → Outbox → 审计</text>
<text x="85" y="601" class="small" text-anchor="start">每次节点 / 工具 / 能力互调重新授权；租户与账号范围仍由业务 SQL 强制执行</text>
<path d="M595 630V675" class="line"/>
<rect x="60" y="675" width="1070" height="270" rx="16" fill="#eaf1fd" stroke="#7b9ed3" stroke-width="1.5"/>
<text x="85" y="719" class="section" text-anchor="start">04  按需选择执行方式 · 不要求所有调用都经过 Workflow</text>
<rect x="83" y="743" width="330" height="175" rx="16" fill="#f8fbff" stroke="#96aed0" stroke-width="1.5"/>
<text x="101" y="781" class="section" text-anchor="start">原子业务能力</text>
<text x="101" y="823" class="small" text-anchor="start">领域规则与状态约束</text>
<text x="101" y="855" class="small" text-anchor="start">业务 SQL / 可信范围</text>
<text x="101" y="887" class="small" text-anchor="start">新写能力 TxExecutor</text>
<rect x="430" y="743" width="330" height="175" rx="16" fill="#f8fbff" stroke="#96aed0" stroke-width="1.5"/>
<text x="448" y="781" class="section" text-anchor="start">同步能力组合</text>
<text x="448" y="823" class="small" text-anchor="start">Go Executor</text>
<text x="448" y="855" class="small" text-anchor="start">经 Gateway 复用能力</text>
<text x="448" y="887" class="small" text-anchor="start">多个调用 ≠ 全局事务</text>
<rect x="777" y="743" width="330" height="175" rx="16" fill="#f8fbff" stroke="#96aed0" stroke-width="1.5"/>
<text x="795" y="781" class="section" text-anchor="start">Eino 持久化编排</text>
<text x="795" y="823" class="small" text-anchor="start">Workflow：依赖与恢复</text>
<text x="795" y="855" class="small" text-anchor="start">Graph：有界循环 / 重试</text>
<text x="795" y="887" class="small" text-anchor="start">ADK：受限工具决策</text>
<path d="M60 852H25V550H59" class="line" stroke-dasharray="7 5"/>
<text x="85" y="970" class="label" text-anchor="start">节点、子能力与工具均回到 Gateway；模型不能替代权限或人工审核</text>
<path d="M595 945V990" class="line"/>
<rect x="60" y="990" width="1070" height="130" rx="16" fill="#eeece7" stroke="#aaa797" stroke-width="1.5"/>
<text x="85" y="1033" class="section" text-anchor="start">05  数据与持久化</text>
<text x="85" y="1069" class="body" text-anchor="start">PostgreSQL：业务数据 · cap_invocations / approvals / outbox / events</text>
<text x="85" y="1101" class="small" text-anchor="start">ai_runs：独立 AI / 编排运行    |    orch_checkpoints：加密状态与回执</text>
<path d="M595 1120V1165" class="line"/>
<rect x="60" y="1165" width="1070" height="150" rx="16" fill="#fff2df" stroke="#cfaa6f" stroke-width="1.5"/>
<text x="85" y="1206" class="section" text-anchor="start">06  业务事件 → AI 行为 → 下一次能力调用</text>
<text x="93" y="1249" class="body" text-anchor="start">事务 Outbox</text>
<text x="93" y="1285" class="small" text-anchor="start">Relay 至少一次投递</text>
<text x="453" y="1249" class="body" text-anchor="start">Event Hub</text>
<text x="453" y="1285" class="small" text-anchor="start">事实事件分发</text>
<text x="813" y="1249" class="body" text-anchor="start">AI Trigger</text>
<text x="813" y="1285" class="small" text-anchor="start">去重 / 深度 / 身份重建</text>
<path d="M365 1242H427" class="line"/>
<path d="M725 1242H787" class="line"/>
<path d="M1130 1245H1540V550H1130" class="line" stroke-dasharray="7 5"/>
<text x="1567" y="1000" class="label" transform="rotate(-90 1567 1000)">AI / 专用业务路径的后续动作重新进入 Gateway</text>
<rect x="1180" y="150" width="330" height="280" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="1.5"/>
<text x="1202" y="193" class="section" text-anchor="start">工程侧：唯一事实源</text>
<text x="1202" y="234" class="small" text-anchor="start">AGENTS / Skills：开发步骤</text>
<text x="1202" y="268" class="small" text-anchor="start">Definition：业务能力契约</text>
<text x="1202" y="302" class="small" text-anchor="start">Goa：传输信封与 SDK</text>
<text x="1202" y="336" class="small" text-anchor="start">SQL：迁移 / sqlc</text>
<text x="1202" y="370" class="small" text-anchor="start">实体声明：对象与状态</text>
<text x="1202" y="404" class="small" text-anchor="start">流程 spec：JSON Schema</text>
<rect x="1180" y="470" width="330" height="160" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="1.5"/>
<text x="1202" y="512" class="section" text-anchor="start">身份与执行治理</text>
<text x="1202" y="551" class="small" text-anchor="start">Principal / Casbin / 数据范围</text>
<text x="1202" y="581" class="small" text-anchor="start">Policy / 审批 / 审计</text>
<text x="1202" y="611" class="small" text-anchor="start">审批不扩大原申请人权限</text>
<rect x="1180" y="675" width="330" height="270" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="1.5"/>
<text x="1202" y="719" class="section" text-anchor="start">运行与集成边界</text>
<text x="1202" y="762" class="small" text-anchor="start">Workflow：暂停 / 重启恢复</text>
<text x="1202" y="793" class="small" text-anchor="start">Graph：退出与步数预算</text>
<text x="1202" y="824" class="small" text-anchor="start">ADK：工具允许集 / 迭代预算</text>
<text x="1202" y="855" class="small" text-anchor="start">Redis：知识向量检索</text>
<text x="1202" y="886" class="small" text-anchor="start">模型 / 存储 / 邮件适配</text>
<text x="1202" y="917" class="small" text-anchor="start">均不授予业务执行权限</text>
<rect x="1180" y="990" width="330" height="325" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="1.5"/>
<text x="1202" y="1033" class="section" text-anchor="start">阅读与验收</text>
<text x="1202" y="1075" class="small" text-anchor="start">能力优先复用、组合、扩展</text>
<text x="1202" y="1107" class="small" text-anchor="start">Schema 不证明业务安全</text>
<text x="1202" y="1139" class="small" text-anchor="start">业务人工任务 ≠ 风险确认</text>
<text x="1202" y="1171" class="small" text-anchor="start">旧自持事务 Outbox 有窗口</text>
<text x="1202" y="1203" class="small" text-anchor="start">框架支持 ≠ 所有业务已接入</text>
<text x="1202" y="1235" class="small" text-anchor="start">文章 Workflow / ADK 待改造</text>
<text x="1202" y="1267" class="small" text-anchor="start">本地检查 ≠ 远程 CI 通过</text>
<text x="60" y="1371" class="small" text-anchor="start">实线：主要关系    虚线：回到 Gateway    业务动作与 Outbox 仅在实际同事务路径上保证原子</text>
<text x="60" y="1410" class="small" text-anchor="start">Registry 为 Gateway 提供契约；这是概念分层图，运行时并非每次请求串行遍历全部层。</text>
</svg>