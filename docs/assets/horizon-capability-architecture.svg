<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Horizon AI-Native 概念架构</title><desc id="desc">交互触发进入任务与编排，Workflow、Graph 和 ADK 组织行动；所有业务调用通过 Capability Gateway，复用能力模型、注册与触发体系；执行产生业务事实与事件，再驱动后续行为。简单动作可以直接进入 Gateway。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688078"/></marker></defs>
<rect width="1600" height="1600" rx="24" fill="#f7f9f8"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17483e}.title{font-size:34px;font-weight:700}.section{font-size:27px;font-weight:650}.body{font-size:23px}.small{font-size:21px;fill:#436e63}.note{font-size:19px;fill:#59776e}.blue{fill:#214e7f}.line{fill:none;stroke:#688078;stroke-width:2.4;marker-end:url(#arrow)}</style>
<text x="100" y="65" class="title" text-anchor="start">Horizon · AI-Native 应用概念架构</text>
<text x="100" y="103" class="small" text-anchor="start">一套业务能力，连接人的意图、Agent 的判断与系统的真实行动</text>
<rect x="100" y="140" width="1260" height="105" rx="18" fill="#e3f3ed" stroke="#70a18e" stroke-width="1.5"/>
<text x="730" y="182" class="section" text-anchor="middle">交互与触发</text>
<text x="730" y="221" class="body" text-anchor="middle">页面按钮 · Agent · 业务事件 · 外部 API · 流程触发</text>
<path d="M730 245V285" class="line"/>
<rect x="100" y="285" width="1260" height="210" rx="18" fill="#e8f0fc" stroke="#779fce" stroke-width="1.5"/>
<text x="126" y="329" class="section blue" text-anchor="start">任务与编排 · 组织目标、步骤与智能决策</text>
<rect x="126" y="350" width="388" height="118" rx="18" fill="#d4e4f8" stroke="#82a5cf" stroke-width="1.5"/>
<text x="320" y="387" class="section blue" text-anchor="middle">Workflow 主干</text>
<text x="320" y="423" class="small" text-anchor="middle">步骤与依赖 · 人机协作</text>
<text x="320" y="453" class="small" text-anchor="middle">等待 · 暂停 · 恢复</text>
<rect x="536" y="350" width="388" height="118" rx="18" fill="#d4e4f8" stroke="#82a5cf" stroke-width="1.5"/>
<text x="730" y="387" class="section blue" text-anchor="middle">Graph 子图</text>
<text x="730" y="423" class="small" text-anchor="middle">局部循环 · 检查与复核</text>
<text x="730" y="453" class="small" text-anchor="middle">有界重试 · 明确退出</text>
<rect x="946" y="350" width="388" height="118" rx="18" fill="#d4e4f8" stroke="#82a5cf" stroke-width="1.5"/>
<text x="1140" y="387" class="section blue" text-anchor="middle">ADK Agent 节点</text>
<text x="1140" y="423" class="small" text-anchor="middle">理解上下文 · 选择工具</text>
<text x="1140" y="453" class="small" text-anchor="middle">受限自主决策 · 返回结论</text>
<path d="M730 495V560" class="line"/>
<text x="750" y="535" class="note" text-anchor="start">每个业务节点与工具都经过 Gateway</text>
<path d="M100 190H52V625H99" class="line" stroke-dasharray="7 6"/>
<text x="35" y="500" class="note" transform="rotate(-90 35 500)">简单动作可直接调用能力</text>
<rect x="100" y="560" width="1260" height="130" rx="18" fill="#d9eee4" stroke="#5b927c" stroke-width="1.5"/>
<text x="730" y="609" class="section" text-anchor="middle">Capability Gateway · 统一业务执行边界</text>
<text x="730" y="655" class="body" text-anchor="middle">身份 · 权限 · 输入契约 · 幂等 · 风险与审批 · 事件 · 审计</text>
<path d="M730 690V730" class="line"/>
<rect x="100" y="730" width="1260" height="205" rx="18" fill="#e3f3ed" stroke="#70a18e" stroke-width="1.5"/>
<text x="126" y="774" class="section" text-anchor="start">能力体系 · 实体语义与 Schema 契约，让能力可理解、可组合</text>
<rect x="126" y="795" width="388" height="112" rx="18" fill="#f5fbf8" stroke="#9cbcad" stroke-width="1.5"/>
<text x="320" y="831" class="section" text-anchor="middle">实体与能力模型</text>
<text x="320" y="864" class="small" text-anchor="middle">Entity：字段 / 关系 / 状态</text>
<text x="320" y="895" class="small" text-anchor="middle">Schema：输入 / 输出 / 边界</text>
<rect x="536" y="795" width="388" height="112" rx="18" fill="#f5fbf8" stroke="#9cbcad" stroke-width="1.5"/>
<text x="730" y="831" class="section" text-anchor="middle">能力注册</text>
<text x="730" y="864" class="small" text-anchor="middle">形成可发现的业务目录</text>
<text x="730" y="895" class="small" text-anchor="middle">支持版本、复用与组合</text>
<rect x="946" y="795" width="388" height="112" rx="18" fill="#f5fbf8" stroke="#9cbcad" stroke-width="1.5"/>
<text x="1140" y="831" class="section" text-anchor="middle">能力触发</text>
<text x="1140" y="864" class="small" text-anchor="middle">按契约定位业务动作</text>
<text x="1140" y="895" class="small" text-anchor="middle">连接调用意图与执行入口</text>
<path d="M730 935V975" class="line"/>
<rect x="100" y="975" width="1260" height="130" rx="18" fill="#e3f3ed" stroke="#70a18e" stroke-width="1.5"/>
<text x="730" y="1022" class="section" text-anchor="middle">业务执行 · 让被允许的动作产生真实结果</text>
<text x="730" y="1069" class="body" text-anchor="middle">领域规则与状态 · 数据操作 · 外部集成 · 结果校验</text>
<path d="M730 1105V1145" class="line"/>
<rect x="100" y="1145" width="1260" height="130" rx="18" fill="#efeee8" stroke="#a29e8c" stroke-width="1.5"/>
<text x="730" y="1191" class="section" text-anchor="middle">业务事实与运行记忆</text>
<text x="730" y="1238" class="body" text-anchor="middle">业务数据 · 任务进度 · 人工决定 · 执行记录 · 恢复上下文</text>
<path d="M730 1275V1315" class="line"/>
<rect x="100" y="1315" width="1260" height="130" rx="18" fill="#fbefdc" stroke="#c8a573" stroke-width="1.5"/>
<text x="730" y="1362" class="section" text-anchor="middle">事件与反馈 · 从已发生的事实启动下一轮行动</text>
<text x="730" y="1409" class="body" text-anchor="middle">业务事件 → 触发策略 → AI / 人工 / 系统后续处理</text>
<path d="M1360 1380H1490V193H1361" class="line" stroke-dasharray="7 6"/>
<text x="1525" y="1080" class="note" transform="rotate(-90 1525 1080)">事件驱动后续工作，新的业务调用重新经过 Gateway</text>
<path d="M1360 1045H1438V193H1361" class="line" stroke-dasharray="7 6"/>
<text x="1418" y="985" class="note" transform="rotate(-90 1418 985)">业务结果返回调用方；长期任务区分受理与完成</text>
<text x="100" y="1490" class="small" text-anchor="start">协作支撑：Skills 与 Schema · 可信身份与知识上下文 · 人工参与 · 可追踪与行为验证</text>
<text x="100" y="1530" class="note" text-anchor="start">概念职责图：编排组织工作；流程启动与节点执行均受 Gateway 管理；各组件按任务需要使用。</text>
<text x="100" y="1563" class="note" text-anchor="start">当前支持与业务接入进度见架构文档；依赖显式声明，能力注册不代表已授权执行。</text>
</svg>