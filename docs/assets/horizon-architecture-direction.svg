<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Horizon 架构方向</title><desc id="desc">四条方向性选择：工具面从契约派生、两个入口共用一个授权内核、只读先行、单体优先。页面工具依赖活动页面，账号工具依赖账号令牌，两者都不自行判定权限，统一经过可信 Principal、Casbin 授权与落在 SQL 的数据范围。能力从只读开始逐步开放，写入、批量导出与 OAuth 按阶段接入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c88a5"/></marker></defs>
<rect width="1200" height="590" rx="24" fill="#f8f9fc"/>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202a40}.muted{fill:#68748d}.blue{fill:#5267ce}</style>
<text x="48" y="54" font-size="28" font-weight="650">HORIZON / 架构方向</text>
<text x="48" y="85" font-size="18" font-weight="400" class="muted">工具面从契约派生，权限只走一条路。</text>

<text x="48" y="126" font-size="17" font-weight="650" class="blue">01 / 四条方向性选择</text>

<rect x="48" y="146" width="264" height="112" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="72" y="182" font-size="20" font-weight="600">契约单一来源</text>
<text x="72" y="212" font-size="15" font-weight="400" class="muted">工具由 DSL 生成</text>
<text x="72" y="236" font-size="15" font-weight="400" class="muted">不是 API 的手抄副本</text>

<rect x="328" y="146" width="264" height="112" rx="14" fill="#eef0ff" stroke="#ccd3f7"/>
<text x="352" y="182" font-size="20" font-weight="600">两个入口，一个内核</text>
<text x="352" y="212" font-size="15" font-weight="400" class="muted">页面工具与账号工具</text>
<text x="352" y="236" font-size="15" font-weight="400" class="muted">共用同一授权内核</text>

<rect x="608" y="146" width="264" height="112" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="632" y="182" font-size="20" font-weight="600">只读先行</text>
<text x="632" y="212" font-size="15" font-weight="400" class="muted">写操作排在审批、</text>
<text x="632" y="236" font-size="15" font-weight="400" class="muted">幂等与审计之后</text>

<rect x="888" y="146" width="264" height="112" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="912" y="182" font-size="20" font-weight="600">单体优先</text>
<text x="912" y="212" font-size="15" font-weight="400" class="muted">一个 Go 服务承载业务</text>
<text x="912" y="236" font-size="15" font-weight="400" class="muted">不提前拆分微服务</text>

<text x="48" y="300" font-size="17" font-weight="650" class="blue">02 / 两个入口，同一个授权内核</text>

<rect x="48" y="316" width="430" height="78" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="72" y="348" font-size="20" font-weight="600">页面工具 · WebMCP</text>
<text x="72" y="376" font-size="16" font-weight="400" class="muted">随路由注册与撤销 · 依赖活动页面</text>

<rect x="722" y="316" width="430" height="78" rx="14" fill="#eef0ff" stroke="#ccd3f7"/>
<text x="746" y="348" font-size="20" font-weight="600">账号工具 · 远程 MCP</text>
<text x="746" y="376" font-size="16" font-weight="400" class="muted">账号令牌 · 不依赖页面在线</text>

<path d="M 263 394 L 263 428" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 937 394 L 937 428" fill="none" stroke="#7c88a5" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="48" y="428" width="1104" height="100" rx="14" fill="#fff" stroke="#dce1ed"/>
<text x="76" y="464" font-size="20" font-weight="650">同一套授权内核</text>
<text x="76" y="496" font-size="16" font-weight="400" class="muted">可信 Principal  →  Casbin（deny 覆盖 allow）  →  数据范围  →  参数化 SQL，判定失败即拒绝</text>

<text x="48" y="560" font-size="16" font-weight="400" class="muted">已开放：导航 · 筛选 · 只读详情 · 脱敏诊断　　　规划中：写入 · 批量导出 · OAuth</text>
</svg>
