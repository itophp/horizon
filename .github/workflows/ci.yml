name: Quality gates
# Manual only: commits and pushes must not start remote verification. Full browser
# E2E lives in e2e.yml behind the same manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: baseline
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: baseline_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U baseline -d baseline_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://baseline:ci-test-only@127.0.0.1:54329/baseline_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: ./scripts/go.sh build -trimpath -o ../horizon-cli ../cmd/horizon-cli
      - run: ./horizon-cli install
      - run: ./horizon-cli tools
      - name: Fast gates, contracts and builds
        run: ./horizon-cli ci-fast
      - name: Isolated PostgreSQL integration and negative authorization cases
        run: ./horizon-cli test-integration
