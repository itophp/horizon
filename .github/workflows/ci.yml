name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: baseline
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: baseline_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U baseline -d baseline_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://baseline:ci-test-only@127.0.0.1:54329/baseline_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make tools
      - name: Fast gates, contracts and builds
        run: make ci-fast
      - name: Isolated PostgreSQL integration and negative authorization cases
        run: make test-integration
      - run: pnpm --filter @baseline/web exec playwright install --with-deps chromium
      - name: WebMCP real client smoke
        run: make test-webmcp-e2e
      - name: Real frontend and backend end-to-end
        run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
